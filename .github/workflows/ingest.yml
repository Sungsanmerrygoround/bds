name: ingest

# 매일 KST 07:10 실거래(최근 3개월 재수집 + 신고가·하락 판단),
# 매주 월요일 KST 07:40 청약홈 입주 물량 + 3~8개월 전 매매 재수집(나중에 채워지는 등기일 반영).
# 실패하면 GitHub가 저장소 소유자에게 메일을 보낸다.
on:
  schedule:
    - cron: "10 22 * * *" # 매일 22:10 UTC = KST 07:10
    - cron: "40 22 * * 0" # 일요일 22:40 UTC = KST 월요일 07:40
  workflow_dispatch:
    inputs:
      job:
        description: "실행할 작업"
        type: choice
        options: [daily, supply, refresh]
        default: daily

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      JOB: ${{ github.event_name == 'workflow_dispatch' && inputs.job || (github.event.schedule == '40 22 * * 0' && 'supply' || 'daily') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Secrets 점검 (값은 출력하지 않음)
        run: |
          fail=0
          for name in DATA_GO_KR_SERVICE_KEY SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            v="${!name}"
            if [ -z "$v" ]; then echo "::error::Secret $name 이 비어 있거나 등록되지 않았습니다"; fail=1; continue; fi
            if [ "$v" != "$(echo "$v" | tr -d '[:space:]\"'"'")" ]; then echo "::error::Secret $name 에 공백·줄바꿈·따옴표가 들어 있습니다"; fail=1; fi
            echo "$name: ${#v}자"
          done
          case "$SUPABASE_URL" in https://*.supabase.co|https://*.supabase.co/) ;; *) echo "::error::SUPABASE_URL 형식이 https://<ref>.supabase.co 가 아닙니다"; fail=1;; esac
          exit $fail
      - run: npm run ingest -- "$JOB"
      - name: 등기일 반영 재수집 (주간)
        if: github.event.schedule == '40 22 * * 0'
        run: npm run ingest -- refresh
